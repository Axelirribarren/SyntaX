name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    # La matriz no es cosmética: la spec del digest promete determinismo entre
    # plataformas y toda la utilidad de `verify` en un equipo depende de eso.
    # Sin correrlo en las tres, esa promesa no tiene evidencia.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Afirmar antes de asumir: qué finales de línea produjo REALMENTE este
      # checkout. Si todos llegan con LF, `verify` en verde sigue sirviendo pero
      # no prueba la normalización de CRLF, y conviene que el log lo diga.
      - name: Finales de línea del checkout
        run: node scripts/report-eol.mjs

      - run: npm test

      # El guard de drift de la documentación deja de depender de que alguien se
      # acuerde de correrlo antes de pushear.
      - run: npm run docs:check

      - run: npm run doctor

      # El dogfood: el mismo syntax.lock, contra checkouts que pueden diferir en
      # finales de línea. `--strict` porque el repo sostiene el contrato que
      # promociona: si aparece una skill que nadie declaró, rompe.
      - name: verify (dogfood)
        run: node src/cli.js verify --strict

      # `verify` tiene que mirar solo el repo. Si tomara skills globales del
      # home del runner, --strict quedaría a merced de la imagen de Actions.
      - name: verify no mira fuera del repo
        run: node scripts/assert-repo-scope.mjs
